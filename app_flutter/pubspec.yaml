name: deteccion_rostros_final
description: "Sistema de asistencia con reconocimiento facial para estudiantes."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.12.0+1
  google_mlkit_face_detection: ^0.13.2
  tflite_flutter: ^0.12.1
  image: ^4.9.1
  sqflite: ^2.4.2+1
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.2
flutter:
  uses-material-design: true
  assets:
    - assets/modelos/
    - assets/perfiles/
    - assets/logo/
flutter_native_splash:
  color: "#071E3D"
  image: assets/logo/logo.png
  android: true
  ios: true

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo/logo.png"
  min_sdk_android: 21
